<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nosso Amor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 0.2em;
    }

    h2 {
      margin-top: 0;
      font-weight: normal;
      font-size: 1.5em;
      color: #fff;
    }

    .slideshow-container {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 20px 0;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slideshow-container img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slideshow-container img.active {
      opacity: 1;
    }

    .counter {
      font-size: 1.8em;
      margin-top: 10px;
      color: #fff;
      font-weight: bold;
    }

    .phrase {
      margin-top: 30px;
      font-size: 1.3em;
      padding: 0 20px;
      color: #fff;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #fff;
    }
  </style>
</head>
<body>

  <h1>Igor & Vanessa</h1>
  <h2>Desde 15/11/2024</h2>

  <!-- Galeria de fotos -->
  <div class="slideshow-container">
    <img src="https://i.imgur.com/Rufh2NU.jpeg" class="active" alt="Foto 1">
    <img src="https://i.imgur.com/55rkmpV.jpeg" alt="Foto 2">
    <img src="https://i.imgur.com/esexv2B.jpeg" alt="Foto 3">
    <img src="https://i.imgur.com/pZVh3tx.jpeg" alt="Foto 4">
    <img src="https://i.imgur.com/ssyBTV5.jpeg" alt="Foto 5">
    <img src="https://i.imgur.com/8hbQF7f.jpeg" alt="Foto 6">
  </div>

  <div class="counter" id="counter"></div>
  <div class="counter" id="monthCounter"></div>

  <div class="phrase">
    "Você é o meu hoje e todos os meus amanhãs." 💖
  </div>

  <div class="footer">
    Feito com amor 🌹
  </div>

  <script>
    // Contador de dias
    const startDate = new Date("2024-11-15");
    const today = new Date();


    // Calcular meses
    let months = today.getMonth() - startDate.getMonth() + (12 * (today.getFullYear() - startDate.getFullYear()));
    
    // Ajuste caso o mês atual seja menor que o mês de início
    if (today.getDate() < startDate.getDate()) {
      months--;
    }

    document.getElementById('monthCounter').innerText = `Nós estamos juntos há ${months} meses!`;

    // Slideshow
    const slides = document.querySelectorAll('.slideshow-container img');
    let currentIndex = 0;

    setInterval(() => {
      slides[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % slides.length;
      slides[currentIndex].classList.add('active');
    }, 3000); // Troca a cada 3 segundos
  </script>
</body>
</html>
