<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nosso Amor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 0.2em;
    }

    h2 {
      margin-top: 0;
      font-weight: normal;
      font-size: 1.5em;
      color: #fff;
    }

    .slideshow-container {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 20px 0;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slideshow-container img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slideshow-container img.active {
      opacity: 1;
    }

    .counter {
      font-size: 1.8em;
      margin-top: 10px;
      color: #fff;
      font-weight: bold;
    }

    .phrase {
      margin-top: 30px;
      font-size: 1.3em;
      padding: 0 20px;
      color: #fff;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #fff;
    }

    .music-button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1em;
      background-color: #fff;
      color: #ee9ca7;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .music-button:hover {
      background-color: #f8d9dd;
    }

    #player {
      width: 0;
      height: 0;
    }

    /* Responsivo para telas menores */
    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }

      h2 {
        font-size: 1.2em;
      }

      .counter {
        font-size: 1.4em;
      }

      .phrase {
        font-size: 1.1em;
      }

      .music-button {
        font-size: 0.95em;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>

  <h1>Igor & Vanessa</h1>
  <h2>Desde 15/11/2024</h2>

  <!-- Botão para tocar/pausar música do YouTube -->
  <button class="music-button" onclick="toggleMusic()">Tocar Música 🎵</button>

  <!-- Player YouTube invisível -->
  <div id="player"></div>

  <!-- Galeria de fotos -->
  <div class="slideshow-container">
    <img src="https://i.imgur.com/8hbQF7f.jpeg" class="active" alt="Foto 1">
    <img src="https://i.imgur.com/55rkmpV.jpeg" alt="Foto 2">
    <img src="https://i.imgur.com/esexv2B.jpeg" alt="Foto 3">
    <img src="https://i.imgur.com/pZVh3tx.jpeg" alt="Foto 4">
    <img src="https://i.imgur.com/ssyBTV5.jpeg" alt="Foto 5">
  </div>

  <div class="counter" id="counter"></div>
  <div class="counter" id="monthCounter"></div>

  <div class="phrase">
    "Você é o meu hoje e todos os meus amanhãs." 💖
  </div>

  <div class="footer">
    Feito com amor 🌹
  </div>

  <!-- Scripts -->
  <script>
    // Contador de meses
    const startDate = new Date("2024-11-15");
    const today = new Date();
    let months = today.getMonth() - startDate.getMonth() + (12 * (today.getFullYear() - startDate.getFullYear()));
    if (today.getDate() < startDate.getDate()) {
      months--;
    }
    document.getElementById('monthCounter').innerText = `Nós estamos juntos há ${months} meses!`;

    // Slideshow
    const slides = document.querySelectorAll('.slideshow-container img');
    let currentIndex = 0;
    setInterval(() => {
      slides[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % slides.length;
      slides[currentIndex].classList.add('active');
    }, 3000);

    // YouTube API
    let player;
    let isPlaying = false;

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '0',
        width: '0',
        videoId: 'pf0krqNORZo',
        playerVars: {
          autoplay: 0,
          loop: 1,
          playlist: 'pf0krqNORZo'
        }
      });
    }

    function toggleMusic() {
      if (!player || typeof player.getPlayerState !== 'function') return;

      const button = document.querySelector(".music-button");

      if (!isPlaying) {
        player.setVolume(30); // Volume entre 0 e 100
        player.playVideo();
        button.innerText = "Pausar Música 🎵";
        isPlaying = true;
      } else {
        player.pauseVideo();
        button.innerText = "Tocar Música 🎵";
        isPlaying = false;
      }
    }
  </script>
</body>
</html>
